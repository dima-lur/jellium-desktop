name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Rust format
        run: cargo fmt --manifest-path src/Cargo.toml --all -- --check
      - name: Bridge and diagnostic report regression tests
        run: node --test src/web/tests/bridge.test.cjs dev/diagnostics/report.test.cjs

  collector-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect and render without a running client or GPU requirement
        shell: pwsh
        run: |
          dev/diagnostics/capture.ps1 -Executable "$PSHOME/pwsh.exe" -OutputDirectory build/diagnostics/ci -Once
          dev/diagnostics/mark.ps1 -Directory build/diagnostics/ci -Action baseline
          node dev/diagnostics/report.cjs build/diagnostics/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $records = Get-Content build/diagnostics/ci/samples.jsonl | ConvertFrom-Json
          if (@($records | Where-Object type -eq sample).Count -ne 1) { throw 'Missing sample' }
          if (@($records | Where-Object type -eq capture-stop).Count -ne 1) { throw 'Missing final record' }
      - name: Collector identity, privacy, and missing-counter regression tests
        shell: pwsh
        run: dev/diagnostics/capture.test.ps1 -OutputRoot build/diagnostics/fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-collector-smoke
          path: build/diagnostics/ci
